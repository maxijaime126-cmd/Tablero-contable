name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 */8 * * *'   # tres veces por dia (varias consultas a la base por dia, no solo una cada tanto)
  workflow_dispatch: {}      # tambien se puede ejecutar a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de Supabase (3 veces)
        run: |
          URL="https://ovmtacwcrxfxtxsggbxt.supabase.co/rest/v1/tablero?select=id,updated_at&limit=1"
          KEY="sb_publishable_llgiKHW2EOOTiP4haWewFg_Vubpj01W"
          for i in 1 2 3; do
            code=$(curl -s -o respuesta.json -w "%{http_code}" "$URL" -H "apikey: $KEY")
            echo "Intento $i - Supabase respondio: $code"
            cat respuesta.json; echo
            if [ "$code" != "200" ]; then
              echo "::error::Supabase no respondio 200 (respondio $code)"
              exit 1
            fi
            sleep 5
          done
